[project]
name = "soccer-tracking"
version = "0.1.0"
description = "Player and ball tracking with automatic pitch registration for soccer footage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "ultralytics>=8.3",
    "supervision>=0.26",
    "trackers>=2.0",
    "opencv-python>=4.10",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "mplsoccer",
]
