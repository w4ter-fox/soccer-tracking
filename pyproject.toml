[project]
name = "soccer-tracking"
version = "0.2.0"
description = "Player and ball tracking with automatic pitch registration for soccer footage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "ultralytics>=8.3",
    "supervision>=0.26",
    "trackers>=2.0",
    "opencv-python>=4.10",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "mplsoccer",
]

[project.scripts]
soccer-track = "soccer_tracking.track:main"
soccer-register = "soccer_tracking.registration:main"
soccer-visualize = "soccer_tracking.visualize:main"
soccer-keyframes = "soccer_tracking.keyframes:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # 日本語のコメントが長くなるため
    "E701",   # 短いキー操作の分岐を1行で書いている箇所がある
    "E702",
    "B905",   # zip(strict=...) は Python 3.10 以降のみ
    "UP031",
]
